[project]
name = "quillmark-bot"
version = "0.1.0"
description = "CAG + RAG customer-service chatbot for the fictional Quillmark Bank"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "torch>=2.4",
    "transformers>=5.22",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "sentence-transformers>=5.0",
    "rank-bm25>=0.2",
    "streamlit>=1.45",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
