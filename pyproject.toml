[project]
name = "quillmark-bot"
version = "0.1.0"
description = "CAG + RAG customer-service chatbot for the fictional Quillmark Bank"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
