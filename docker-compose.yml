services:
  postgres:
    image: postgres:16-alpine
    container_name: quillmark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quillmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quillmark}
      POSTGRES_DB: ${POSTGRES_DB:-quillmark}
    ports:
      # 5432/5433 are often taken by a local Postgres install
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
